name: Deploy Poké Study to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/pokeapi/**'
      - 'public/data/**'
      - 'scripts/prepare-pokedex.mjs'
      - 'scripts/prepare-items.mjs'
      - 'scripts/import-pokeapi-database.mjs'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/vendor-pokeapi.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-npm-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
